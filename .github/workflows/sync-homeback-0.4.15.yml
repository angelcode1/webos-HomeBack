name: Sync HomeBack 0.4.15 exact source

on:
  push:
    branches:
      - release-0.4.15-staging

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: release-0.4.15-staging
          fetch-depth: 0

      - name: Preserve repository release infrastructure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/homeback-infra/.github/workflows /tmp/homeback-infra/scripts
          cp .github/workflows/release.yml /tmp/homeback-infra/.github/workflows/release.yml
          cp scripts/fix-ipk-installed-size.sh /tmp/homeback-infra/scripts/fix-ipk-installed-size.sh
          cp scripts/generate-manifest.cjs /tmp/homeback-infra/scripts/generate-manifest.cjs
          cp .github/homeback-sync/expected.manifest /tmp/homeback-expected.manifest

      - name: Reconstruct and apply staged 0.4.15 patch
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/homeback-review8/chunk-00.b64
          : > /tmp/homeback-0.4.15.patch
          for chunk in \
            .github/homeback-review8/chunk-00.b64 \
            .github/homeback-review8/chunk-01.b64 \
            .github/homeback-review8/chunk-02.b64 \
            .github/homeback-review8/chunk-04.b64 \
            .github/homeback-review8/chunk-03.b64; do
            base64 --decode "$chunk" >> /tmp/homeback-0.4.15.patch
          done
          git apply --binary --check /tmp/homeback-0.4.15.patch
          git apply --binary /tmp/homeback-0.4.15.patch

      - name: Restore release infrastructure and clean staging artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/workflows scripts
          cp /tmp/homeback-infra/.github/workflows/release.yml .github/workflows/release.yml
          cp /tmp/homeback-infra/scripts/fix-ipk-installed-size.sh scripts/fix-ipk-installed-size.sh
          cp /tmp/homeback-infra/scripts/generate-manifest.cjs scripts/generate-manifest.cjs
          chmod +x scripts/fix-ipk-installed-size.sh
          rm -rf .github/homeback-review8 .github/homeback-sync
          rm -f .github/workflows/sync-homeback-0.4.15.yml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regenerate Yarn lock for @homeback workspaces
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare yarn@4.12.0 --activate
          rm -f yarn.lock
          yarn install --no-immutable
          grep -q '"@homeback/app@workspace:packages/app"' yarn.lock
          grep -q '"@homeback/service@workspace:packages/service"' yarn.lock
          grep -q '"@homeback/utils@workspace:packages/utils"' yarn.lock
          if grep -q '@althome/' yarn.lock; then
            echo 'stale @althome workspace remains in yarn.lock' >&2
            exit 1
          fi

      - name: Verify exact source parity and repository file set
        shell: bash
        run: |
          set -euo pipefail
          while read -r expected_mode expected_sha path; do
            test -f "$path" || { echo "missing baseline file: $path" >&2; exit 1; }
            actual_sha="$(git hash-object "$path")"
            test "$actual_sha" = "$expected_sha" || {
              echo "content mismatch: $path expected=$expected_sha actual=$actual_sha" >&2
              exit 1
            }
          done < /tmp/homeback-expected.manifest

          git add -A

          while read -r expected_mode expected_sha path; do
            actual_mode="$(git ls-files -s -- "$path" | awk '{print $1}')"
            test "$actual_mode" = "$expected_mode" || {
              echo "mode mismatch: $path expected=$expected_mode actual=$actual_mode" >&2
              exit 1
            }
          done < /tmp/homeback-expected.manifest

          awk '{ $1=""; $2=""; sub(/^  */, ""); print }' /tmp/homeback-expected.manifest > /tmp/expected-paths
          printf '%s\n' \
            '.github/workflows/release.yml' \
            'scripts/fix-ipk-installed-size.sh' \
            'scripts/generate-manifest.cjs' \
            'yarn.lock' >> /tmp/expected-paths
          sort -u /tmp/expected-paths -o /tmp/expected-paths
          git ls-files | sort -u > /tmp/actual-paths
          if ! diff -u /tmp/expected-paths /tmp/actual-paths; then
            echo 'repository file set differs from all-review-fixes baseline plus approved release infrastructure' >&2
            exit 1
          fi

          git diff --cached --check

      - name: Run full source checks
        shell: bash
        run: |
          set -euo pipefail
          yarn check:full

      - name: Commit exact 0.4.15 source
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync HomeBack 0.4.15 all-review fixes'
          git push origin HEAD:release-0.4.15-staging
