name: Audit HomeBack 0.4.15 source blobs

on:
  push:
    branches:
      - release-0.4.15-staging

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@v4
        with:
          ref: release-0.4.15-staging
          fetch-depth: 0

      - name: Report exact baseline blobs missing from repository history
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          total=0
          while read -r mode sha path; do
            total=$((total + 1))
            if ! git cat-file -e "${sha}^{blob}" 2>/dev/null; then
              printf 'MISSING %s %s %s\n' "$mode" "$sha" "$path"
              missing=$((missing + 1))
            fi
          done < .github/homeback-sync/expected.manifest
          echo "BASELINE_TOTAL=$total"
          echo "MISSING_TOTAL=$missing"
