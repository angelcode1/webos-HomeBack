name: Build review-only native remote hook

on:
  pull_request:
    paths:
      - 'native/**'
      - '.github/workflows/native-inputhook.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-c5-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Validate source-lock and unchanged APK baseline
        run: |
          python3 -m unittest discover -s native -p 'test_*.py' -v
          test -s packages/service/vendor/inputhook/ezinject
          test -s packages/service/vendor/inputhook/libinputhookpp.so
      - name: Build from source with verified toolchain
        run: bash native/build-native.sh
      - name: Validate ARM ELF and source manifest
        run: |
          cd native-artifacts
          sha256sum -c SHA256SUMS
          readelf -h ezinject
          readelf -h libinputhookpp.so
          test -f NOT-QUALIFIED.txt
      - name: Upload candidate (not a HomeBack APK)
        uses: actions/upload-artifact@v4
        with:
          name: c5-inputhookpp-source-candidate
          path: native-artifacts/
          if-no-files-found: error
          retention-days: 14

  tv-c5-test-ipk:
    name: Package and publish experimental C5 TV prerelease
    needs: native-c5-candidate
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'review/source-built-remote-hook-c5' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      TEST_VERSION: '0.7.1'
      TEST_TAG: v0.7.1-c5-native-test.1
    steps:
      - name: Checkout exact reviewed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Download built native candidate from this exact run
        uses: actions/download-artifact@v4
        with:
          name: c5-inputhookpp-source-candidate
          path: native-artifacts
      - name: Verify release is new and native candidate is complete
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = '0.7.0'
          test -s native-artifacts/INPUTHOOKPP-GPL-3.0.txt
          test -s native-artifacts/EZINJECT-COPYING.txt
          test -s native-artifacts/NOT-QUALIFIED.txt
          (cd native-artifacts && sha256sum -c SHA256SUMS)
          if gh release view "$TEST_TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing prerelease $TEST_TAG"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TEST_TAG" >/dev/null 2>&1; then
            echo "Refusing to reuse existing tag $TEST_TAG"
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install and validate unchanged application sources
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare yarn@4.12.0 --activate
          yarn install --immutable
          yarn check:full
      - name: Stage source-built candidate only in ephemeral workspace
        shell: bash
        run: |
          set -euo pipefail
          cp -f native-artifacts/ezinject packages/service/vendor/inputhook/ezinject
          cp -f native-artifacts/libinputhookpp.so packages/service/vendor/inputhook/libinputhookpp.so
          cp native-artifacts/INPUTHOOKPP-GPL-3.0.txt packages/service/vendor/inputhook/
          cp native-artifacts/EZINJECT-COPYING.txt packages/service/vendor/inputhook/
          cp native-artifacts/SOURCE-LOCK.txt packages/service/vendor/inputhook/
          cp native-artifacts/NOT-QUALIFIED.txt packages/service/vendor/inputhook/
          cat > packages/service/vendor/inputhook/NOTICE.md <<'NOTICE'
          HomeBack experimental C5 TV build; source-built native payload.
          inputhookpp copyright remains with its authors; GPLv3.
          Source: https://github.com/sundermann/inputhookpp
          Pinned revision: 9dc3cf140cb1ae1dbe059525c72710deea7ecf7d
          Patch and crossbuild: https://github.com/angelcode1/webos-HomeBack/tree/review/source-built-remote-hook-c5/native
          See INPUTHOOKPP-GPL-3.0.txt for the full license.
          ezinject copyright remains with its authors; see EZINJECT-COPYING.txt.
          Source: https://github.com/smx-smx/ezinject
          Pinned revision: 607055c06b037eadc3992008940d99bdc4a14f53
          This native hook is unqualified on the physical LG C5; test and revert if needed.
          NOTICE
          node - <<'NODE'
          const fs = require('node:fs');
          const file = 'package.json';
          const obj = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (obj.version !== '0.7.0') throw new Error('Unexpected original version');
          obj.version = '0.7.1';
          fs.writeFileSync(file, JSON.stringify(obj, null, 2) + '\n');
          NODE
          test "$(node -p "require('./package.json').version")" = "$TEST_VERSION"
      - name: Build versioned HomeBack TV test packages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          yarn build
          APP_ID="$(node -p "require('./package.json').id")"
          MAIN_IPK="dist/${APP_ID}_${TEST_VERSION}_all.ipk"
          CAMERA_IPK="dist/pip-camera/${APP_ID}.camera_${TEST_VERSION}_all.ipk"
          test -s "$MAIN_IPK"
          test -s "$CAMERA_IPK"
          bash scripts/fix-ipk-installed-size.sh "$MAIN_IPK"
          bash scripts/fix-ipk-installed-size.sh "$CAMERA_IPK"
          echo "MAIN_IPK=$MAIN_IPK" >> "$GITHUB_ENV"
          echo "CAMERA_IPK=$CAMERA_IPK" >> "$GITHUB_ENV"
      - name: Assert packaged hook exactly matches compiled candidate
        shell: bash
        run: |
          set -euo pipefail
          TEMP="$(mktemp -d)"
          trap 'rm -rf "$TEMP"' EXIT
          ar p "$MAIN_IPK" data.tar.gz | tar -xzf - -C "$TEMP"
          for file in ezinject libinputhookpp.so; do
            mapfile -t paths < <(find "$TEMP" -type f -name "$file")
            if [ "${#paths[@]}" -ne 1 ]; then
              echo "Expected one packed $file; found ${#paths[@]}"
              exit 1
            fi
            cmp "native-artifacts/$file" "${paths[0]}"
            echo "Verified packaged candidate: $file"
          done
          mapfile -t licenses < <(find "$TEMP" -type f -name 'INPUTHOOKPP-GPL-3.0.txt')
          test "${#licenses[@]}" -eq 1
          sha256sum "$MAIN_IPK" > "${MAIN_IPK}.sha256"
          sha256sum "$CAMERA_IPK" > "${CAMERA_IPK}.sha256"
          cat "${MAIN_IPK}.sha256" "${CAMERA_IPK}.sha256"
      - name: Upload test IPKs independent of public release
        uses: actions/upload-artifact@v4
        with:
          name: homeback-c5-native-test-0.7.1
          path: |
            dist/*.ipk
            dist/*.sha256
            dist/pip-camera/*.ipk
            dist/pip-camera/*.sha256
            native-artifacts/SOURCE-LOCK.txt
            native-artifacts/NOT-QUALIFIED.txt
          if-no-files-found: error
          retention-days: 14
      - name: Create GitHub prerelease, never catalog or stable
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/c5-release-notes.md" <<'NOTES'
          ## EXPERIMENTAL LG C5 remote hook - TV test only

          This is an **opt-in test build**, not a stable release or a verified fix.
          HomeBack app version: 0.7.1. This prerelease is built from the source branch of PR #76.
          Native components are cross-compiled from the pinned source revisions in SOURCE-LOCK.txt.
          The HomeBack UI, settings, key mapping defaults, service control, and injection ownership
          are otherwise unchanged from 0.7.0.

          The known-good 0.7.0 APK/IPK uses different, previously bundled binaries; this test
          replaces **both** native files inside the packaged service. The physical LG C5 runtime,
          native input target ELF class and all short/long-press behaviors still require validation.

          ### Before installing
          Back up `/home/root/.config/homeback/remote-buttons.json` and keep a copy of your
          working HomeBack 0.7.0 IPK. Do not remove it or clear app data.

          Install `com.homebrew.homeback_0.7.1_all.ipk` using your usual rooted webOS/Homebrew
          installation method. The camera companion IPK is optional for this remote-input test.
          Reboot before testing to clear any old native hooks retained in target processes.
          Confirm Home, long Home, Netflix, Prime, Disney+, LG Channels, Alexa, and Stan mappings
          and watch the input-hook and HomeBack logs.

          ### Rollback
          Reinstall your saved working 0.7.0 HomeBack IPK, preserving configuration, then reboot.
          If the TV no longer responds to a remote, use your existing SSH/root recovery access
          instead of repeatedly reinjecting or resetting the TV.

          ### Licensing and provenance
          Source and native patch are in the reviewed branch of this repository. The inputhookpp
          component is GPL-3.0; the ezinject component carries its own COPYING notice.
          The exact upstream revisions, toolchain checksum and built binary hashes are published
          with this test package. No Homebrew catalog changes or production release are made.
          NOTES
          gh release create "$TEST_TAG"             "$MAIN_IPK" "${MAIN_IPK}.sha256"             "$CAMERA_IPK" "${CAMERA_IPK}.sha256"             native-artifacts/SOURCE-LOCK.txt             native-artifacts/INPUTHOOKPP-GPL-3.0.txt             native-artifacts/EZINJECT-COPYING.txt             --target "$SOURCE_SHA"             --title 'HomeBack 0.7.1 C5 native-source TV test (EXPERIMENTAL)'             --prerelease             --notes-file "$RUNNER_TEMP/c5-release-notes.md"
