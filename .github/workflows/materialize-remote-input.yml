name: Materialize exact reviewed remote-input

on:
  push:
    branches:
      - release-0.4.15-staging
    paths:
      - '.github/ri-materialize/trigger'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-0.4.15-staging
      - name: Reconstruct exact source file
        shell: bash
        run: |
          set -euo pipefail
          cat .github/ri-materialize/chunk-*.b64 | base64 --decode > /tmp/remote-input.ts.gz
          echo '24042b6ed3607176b6c7116832b96120d7c3d2d9a0886598bbc841eaa27d2fc6  /tmp/remote-input.ts.gz' | sha256sum --check --strict
          gzip -dc /tmp/remote-input.ts.gz > packages/service/src/remote-input.ts
          test "$(git hash-object packages/service/src/remote-input.ts)" = 'b3574089995c15dd54747e8d5879a6e32f556c00'
          git add packages/service/src/remote-input.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Materialize exact reviewed remote-input'
          git push origin HEAD:release-0.4.15-staging
