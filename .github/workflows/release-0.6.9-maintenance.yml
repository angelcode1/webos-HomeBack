name: One-time HomeBack 0.6.9 release maintenance

on:
  issue_comment:
    types:
      - created

permissions:
  actions: write
  contents: write

jobs:
  publish-and-clean:
    if: >-
      github.event.issue.pull_request &&
      github.actor == github.repository_owner &&
      github.event.comment.body == 'PUBLISH HOMEBACK 0.6.9 AND CLEAN STALE BRANCHES'
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale merged branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          delete_branch() {
            branch="$1"
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" >/dev/null 2>&1; then
              echo "Deleting stale branch: ${branch}"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            else
              echo "Branch already absent: ${branch}"
            fi
          }

          delete_branch 'cleanup/first-pass-patch'
          delete_branch 'lg-c5-stock-home-v14'
          delete_branch 'lg-home-minimal-installer'
          delete_branch 'release/catalog-v0.6.8'
          delete_branch 'release/0.6.8-camera-companion'
          delete_branch 'release/0.6.9'

      - name: Dispatch HomeBack 0.6.9 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f version=0.6.9 \
            -f source_ref=main \
            -f confirmation=PUBLISH \
            -f allow_existing_release=false
          echo 'Dispatched HomeBack 0.6.9 release workflow.'
