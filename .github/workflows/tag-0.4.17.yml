name: Publish HomeBack 0.4.17 tag

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tag:
    name: Validate and tag 0.4.17
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate
          yarn --version
      - name: Validate version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "$VERSION" = "0.4.17"
          if git ls-remote --exit-code --tags origin refs/tags/v0.4.17 >/dev/null 2>&1; then
            echo "v0.4.17 already exists"
            exit 1
          fi
      - name: Install dependencies
        run: yarn install --immutable
      - name: Verify source
        run: yarn check:full
      - name: Build production IPK
        run: |
          rm -rf dist
          yarn build
          test -f dist/com.homebrew.homeback_0.4.17_all.ipk
      - name: Create release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.4.17 -m "HomeBack 0.4.17"
          git push origin v0.4.17
