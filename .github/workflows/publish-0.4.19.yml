name: Publish HomeBack 0.4.19

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    name: Validate, tag and publish 0.4.19
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate
          yarn --version
      - name: Validate version and tag state
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "$VERSION" = "0.4.19"
          if git ls-remote --exit-code --tags origin refs/tags/v0.4.19 >/dev/null 2>&1; then
            echo "v0.4.19 already exists"
            exit 1
          fi
      - name: Install dependencies
        run: yarn install --immutable
      - name: Verify source
        run: yarn check:full
      - name: Verify publication
        env:
          HOMEBACK_NATIVE_REDISTRIBUTION_CONFIRMED: ${{ vars.HOMEBACK_NATIVE_REDISTRIBUTION_CONFIRMED }}
        run: yarn verify:publication
      - name: Build production IPK
        run: |
          rm -rf dist
          yarn build
      - name: Validate IPK exists
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          APP_ID="$(node -p "require('./package.json').id")"
          IPK="dist/${APP_ID}_${VERSION}_all.ipk"
          echo "Expected IPK: $IPK"
          test -f "$IPK"
          echo "IPK_PATH=$IPK" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Fix IPK Installed-Size
        run: bash scripts/fix-ipk-installed-size.sh "$IPK_PATH"
      - name: Generate SHA256 checksum
        run: |
          sha256sum "$IPK_PATH" > "${IPK_PATH}.sha256"
          cat "${IPK_PATH}.sha256"
      - name: Generate Homebrew manifest
        run: |
          IPK_HASH="$(cut -d' ' -f1 "${IPK_PATH}.sha256")"
          IPK_NAME="$(basename "$IPK_PATH")"
          MANIFEST_PATH="com.homebrew.homeback.manifest.json"
          IPK_HASH="$IPK_HASH" IPK_NAME="$IPK_NAME" MANIFEST_PATH="$MANIFEST_PATH" node scripts/generate-manifest.cjs
          cat "$MANIFEST_PATH"
          echo "MANIFEST_PATH=$MANIFEST_PATH" >> "$GITHUB_ENV"
      - name: Create release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "HomeBack ${VERSION}"
          git push origin "v${VERSION}"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" "$IPK_PATH" "${IPK_PATH}.sha256" "$MANIFEST_PATH" \
            --verify-tag \
            --title "HomeBack ${VERSION}" \
            --generate-notes
