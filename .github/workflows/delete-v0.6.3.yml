name: Delete withdrawn HomeBack v0.6.3

on:
  push:
    branches:
      - ops/delete-v0.6.3

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete v0.6.3 release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.6.3 \
            --repo "$GITHUB_REPOSITORY" \
            --cleanup-tag \
            --yes
