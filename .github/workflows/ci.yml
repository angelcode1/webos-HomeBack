name: Validate HomeBack

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Install, check and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Verify release workflow is manual-only
        run: |
          grep -q '^  workflow_dispatch:' .github/workflows/release.yml
          if grep -q '^  push:' .github/workflows/release.yml; then
            echo 'release.yml must not publish from push or tag events'
            exit 1
          fi
          grep -q '^      confirmation:' .github/workflows/release.yml
          grep -q 'confirmation must be exactly PUBLISH' .github/workflows/release.yml

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate
          yarn --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Verify source
        run: yarn check:full

      - name: Build production IPKs
        run: |
          rm -rf dist
          yarn build

      - name: Validate HomeBack and camera IPKs exist
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          APP_ID="$(node -p "require('./package.json').id")"
          MAIN_IPK="dist/${APP_ID}_${VERSION}_all.ipk"
          CAMERA_IPK="dist/pip-camera/${APP_ID}.camera_${VERSION}_all.ipk"
          echo "Expected HomeBack IPK: $MAIN_IPK"
          echo "Expected camera companion IPK: $CAMERA_IPK"
          test -f "$MAIN_IPK"
          test -f "$CAMERA_IPK"

      - name: Upload camera-enabled build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: homeback-camera-pip
          path: |
            dist/*.ipk
            dist/pip-camera/*.ipk
          if-no-files-found: error
          retention-days: 7
