name: Materialize v0.4.16 review fixes

on:
  push:
    branches:
      - fix/review-v0.4.16
    paths:
      - '.github/workflows/materialize-v0.4.16.yml'

permissions:
  contents: write

jobs:
  materialize:
    name: Apply, verify and commit review fixes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: fix/review-v0.4.16
          fetch-depth: 0

      - name: Apply reviewed fixes
        run: |
          python -m py_compile .github/scripts/materialize-v0.4.16.py
          python .github/scripts/materialize-v0.4.16.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate
          yarn --version

      - name: Install dependencies immutably
        run: yarn install --immutable

      - name: Verify source, tests, types and lint
        run: yarn check:full

      - name: Verify publication gate
        env:
          HOMEBACK_NATIVE_REDISTRIBUTION_CONFIRMED: ${{ vars.HOMEBACK_NATIVE_REDISTRIBUTION_CONFIRMED }}
        run: yarn verify:publication

      - name: Build production IPK
        run: |
          rm -rf dist
          yarn build
          VERSION="$(node -p "require('./package.json').version")"
          APP_ID="$(node -p "require('./package.json').id")"
          test "$VERSION" = "0.4.16"
          test -f "dist/${APP_ID}_${VERSION}_all.ipk"
          ls -lh dist

      - name: Commit validated candidate
        run: |
          rm .github/workflows/materialize-v0.4.16.yml
          rm .github/scripts/materialize-v0.4.16.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git diff --cached --check
          git commit -m 'Apply review fixes and prepare v0.4.16'
          git push origin HEAD:fix/review-v0.4.16
