\tassert.deepEqual(config.keys['1086'], {
\t\tlabel: 'Custom mapping',
\t\tshort: { action: 'launch', id: 'youtube.leanback.v4' },
\t\tlong: { action: 'replace', keycode: 400 },
\t});
\tassert.deepEqual(config.keys['1111'], {
