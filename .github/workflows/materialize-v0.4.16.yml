          # Version and release-pipeline fixes.
          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          if package['version'] != '0.4.15':
              raise SystemExit(f"unexpected source version: {package['version']}")
          package['version'] = '0.4.16'
          package_path.write_text(json.dumps(package, indent=2) + '\n')
          replace_once(
              'scripts/verify-optimized-source.cjs',
              "requireInvariant(pkg.version === '0.4.15', 'Unexpected application version');",
              "requireInvariant(pkg.version === '0.4.16', 'Unexpected application version');",
          )
          replace_once(
              '.github/workflows/release.yml',
              '      - name: Install dependencies\n        run: yarn install --no-immutable\n',
              '      - name: Validate release tag\n'
              '        run: |\n'
              '          VERSION="$(node -p "require(\'./package.json\').version")"\n'
              '          test "${GITHUB_REF_NAME}" = "v${VERSION}"\n'
              '      - name: Install dependencies\n'
              '        run: yarn install --immutable\n',
          )
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate
          yarn --version

      - name: Install dependencies immutably
        run: yarn install --immutable

      - name: Verify source, tests, types and lint
        run: yarn check:full

      - name: Verify publication gate
        env:
          HOMEBACK_NATIVE_REDISTRIBUTION_CONFIRMED: ${{ vars.HOMEBACK_NATIVE_REDISTRIBUTION_CONFIRMED }}
        run: yarn verify:publication

      - name: Build production IPK
        run: |
          rm -rf dist
          yarn build
          VERSION="$(node -p "require('./package.json').version")"
          APP_ID="$(node -p "require('./package.json').id")"
          test "$VERSION" = "0.4.16"
          test -f "dist/${APP_ID}_${VERSION}_all.ipk"
          ls -lh dist

      - name: Commit validated candidate
        run: |
          rm .github/workflows/materialize-v0.4.16.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git diff --cached --check
          git commit -m 'Apply review fixes and prepare v0.4.16'
          git push origin HEAD:fix/review-v0.4.16
