name: Build and Release HomeBack
run-name: Publish v${{ inputs.version }} from ${{ inputs.source_ref }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix, for example 0.4.21
        required: true
        type: string
      source_ref:
        description: Source branch, tag, or commit to release
        required: true
        default: main
        type: string
      confirmation:
        description: Type PUBLISH to confirm public release creation
        required: true
        type: string
      allow_existing_release:
        description: Allow replacing assets on an existing release
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: homeback-release-v${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Build IPK and create release
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit publication confirmation
        run: |
          if [ "${{ inputs.confirmation }}" != "PUBLISH" ]; then
            echo "Release blocked: confirmation must be exactly PUBLISH"
            exit 1
          fi
          if ! printf '%s' "${{ inputs.version }}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Release blocked: version must look like 0.4.21"
            exit 1
          fi

      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate
          yarn --version

      - name: Validate source version and tag state
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          REQUESTED_VERSION="${{ inputs.version }}"
          TAG="v${REQUESTED_VERSION}"
          SOURCE_SHA="$(git rev-parse HEAD)"

          if [ "$VERSION" != "$REQUESTED_VERSION" ]; then
            echo "Release blocked: package.json is $VERSION but requested version is $REQUESTED_VERSION"
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/${TAG}^{commit}" >/dev/null; then
            TAG_SHA="$(git rev-parse "refs/tags/${TAG}^{commit}")"
            if [ "$TAG_SHA" != "$SOURCE_SHA" ]; then
              echo "Release blocked: $TAG points to $TAG_SHA but selected source is $SOURCE_SHA"
              echo "Do not silently move a published tag; repair it explicitly before publishing."
              exit 1
            fi
            echo "TAG_EXISTS=true" >> "$GITHUB_ENV"
          else
            echo "TAG_EXISTS=false" >> "$GITHUB_ENV"
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

      - name: Reject accidental republish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1 && [ "${{ inputs.allow_existing_release }}" != "true" ]; then
            echo "Release $RELEASE_TAG already exists. Re-run manually with allow_existing_release enabled only if replacement is intentional."
            exit 1
          fi

      - name: Install dependencies
        run: yarn install --immutable

      - name: Verify source
        run: yarn check:full

      - name: Verify publication
        env:
          HOMEBACK_NATIVE_REDISTRIBUTION_CONFIRMED: ${{ vars.HOMEBACK_NATIVE_REDISTRIBUTION_CONFIRMED }}
        run: yarn verify:publication

      - name: Build production IPK
        run: |
          rm -rf dist
          yarn build

      - name: Show build output
        run: |
          echo "Build output:"
          find dist -maxdepth 1 -type f -print
          ls -lh dist

      - name: Validate IPK exists
        run: |
          APP_ID="$(node -p "require('./package.json').id")"
          IPK="dist/${APP_ID}_${VERSION}_all.ipk"
          echo "Expected IPK: $IPK"
          test -f "$IPK"
          echo "IPK_PATH=$IPK" >> "$GITHUB_ENV"

      - name: Fix IPK Installed-Size (packager plugin limitation)
        run: bash scripts/fix-ipk-installed-size.sh "$IPK_PATH"

      - name: Generate SHA256 checksum
        run: |
          sha256sum "$IPK_PATH" > "${IPK_PATH}.sha256"
          cat "${IPK_PATH}.sha256"

      - name: Generate Homebrew manifest
        run: |
          IPK_HASH="$(cut -d' ' -f1 "${IPK_PATH}.sha256")"
          IPK_NAME="$(basename "$IPK_PATH")"
          MANIFEST_PATH="com.homebrew.homeback.manifest.json"
          IPK_HASH="$IPK_HASH" IPK_NAME="$IPK_NAME" MANIFEST_PATH="$MANIFEST_PATH" node scripts/generate-manifest.cjs
          cat "$MANIFEST_PATH"
          echo "MANIFEST_PATH=$MANIFEST_PATH" >> "$GITHUB_ENV"

      - name: Create release tag if needed
        if: env.TAG_EXISTS == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$SOURCE_SHA" -m "HomeBack ${VERSION}"
          git push origin "$RELEASE_TAG"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$IPK_PATH" "${IPK_PATH}.sha256" "$MANIFEST_PATH" --clobber
          else
            gh release create "$RELEASE_TAG" "$IPK_PATH" "${IPK_PATH}.sha256" "$MANIFEST_PATH" \
              --verify-tag \
              --title "HomeBack ${VERSION}" \
              --generate-notes
          fi
