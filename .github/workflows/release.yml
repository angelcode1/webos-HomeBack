name: Build and Release HomeBack
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    name: Build IPK and create release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate
          yarn --version
      - name: Install dependencies
        run: yarn install --no-immutable
      - name: Verify source
        run: yarn check:full
      - name: Verify publication
        env:
          HOMEBACK_NATIVE_REDISTRIBUTION_CONFIRMED: ${{ vars.HOMEBACK_NATIVE_REDISTRIBUTION_CONFIRMED }}
        run: yarn verify:publication
      - name: Build production IPK
        run: |
          rm -rf dist
          yarn build
      - name: Show build output
        run: |
          echo "Build output:"
          find dist -maxdepth 1 -type f -print
          ls -lh dist
      - name: Validate IPK exists
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          APP_ID="$(node -p "require('./package.json').id")"
          IPK="dist/${APP_ID}_${VERSION}_all.ipk"
          echo "Expected IPK: $IPK"
          test -f "$IPK"
          echo "IPK_PATH=$IPK" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Generate SHA256 checksum
        run: |
          sha256sum "$IPK_PATH" > "${IPK_PATH}.sha256"
          cat "${IPK_PATH}.sha256"
      - name: Generate Homebrew manifest
        run: |
          IPK_HASH="$(cut -d' ' -f1 "${IPK_PATH}.sha256")"
          IPK_NAME="$(basename "$IPK_PATH")"
          MANIFEST_PATH="com.homebrew.homeback.manifest.json"
          IPK_HASH="$IPK_HASH" IPK_NAME="$IPK_NAME" MANIFEST_PATH="$MANIFEST_PATH" node scripts/generate-manifest.cjs
          cat "$MANIFEST_PATH"
          echo "MANIFEST_PATH=$MANIFEST_PATH" >> "$GITHUB_ENV"
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" "$IPK_PATH" "${IPK_PATH}.sha256" "$MANIFEST_PATH" --clobber 2>/dev/null || \
          gh release create "${GITHUB_REF_NAME}" "$IPK_PATH" "${IPK_PATH}.sha256" "$MANIFEST_PATH" --title "HomeBack ${VERSION}" --generate-notes
