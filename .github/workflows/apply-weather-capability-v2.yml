name: Apply weather capability v2

on:
  push:
    branches:
      - fix/weather-capability-v2

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/weather-capability-v2
          fetch-depth: 0
      - name: Apply implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {text.count(old)}')
              return text.replace(old, new, 1)

          weather_path = Path('packages/service/src/weather.ts')
          text = weather_path.read_text()

          text = replace_once(text,
          "const STOCK_CAPABILITY_SCHEMA_VERSION = 1;\nconst STOCK_CAPABILITY_PATH = '/home/root/.config/homeback/weather-capability.json';",
          "const STOCK_CAPABILITY_SCHEMA_VERSION = 2;\nexport const WEATHER_CAPABILITY_PATH = '/var/lib/homeback/weather-capability.json';\nconst LEGACY_WEATHER_CAPABILITY_PATH = '/home/root/.config/homeback/weather-capability.json';\nconst TV_SYSTEM_INFO_URI = 'luna://com.webos.service.tv.systemproperty/getSystemInfo';\nconst PLATFORM_INFO_TIMEOUT_MS = 1_500;",
          'capability constants')

          text = replace_once(text,
          "const STOCK_WEATHER_APP_IDS = [\n\t'com.webos.app.home',\n\t'com.webos.app.lifeonscreen',\n\t'com.webos.app.igallery',\n\t'com.webos.app.weatherlocation',\n] as const;\nconst WEBOS_LOCATION_URI = 'luna://com.webos.service.location/getLocationUpdates';",
          "const STOCK_WEATHER_APP_IDS = [\n\t'com.webos.app.home',\n\t'com.webos.app.lifeonscreen',\n\t'com.webos.app.igallery',\n\t'com.webos.app.weatherlocation',\n] as const;\nconst WEATHER_LOCATION_APP_IDS = [\n\t'com.webos.app.weatherlocation',\n\t'com.webos.app.home',\n\t'com.webos.app.lifeonscreen',\n\t'com.webos.app.igallery',\n] as const;\nconst WEBOS_LOCATION_URI = 'luna://com.webos.service.location/getLocationUpdates';",
          'location app ordering')

          old_types = """export type StockWeatherCapability = {
\tschemaVersion: 1;
\tappVersion: string;
\tcheckedAt: number;
\tstockWeatherAvailable: boolean;
\tweatherSource: StockWeatherSource | null;
\tweatherLocation: WeatherLocation | null;
};
"""
          new_types = """export type TvPlatformIdentity = {
\tmodelName: string;
\tfirmwareVersion: string;
\tsdkVersion: string;
};

export type StockWeatherCapability = {
\tschemaVersion: 2;
\tappVersion: string;
\tmodelName: string;
\tfirmwareVersion: string;
\tsdkVersion: string;
\tcheckedAt: number;
\tstockWeatherAvailable: boolean;
\tweatherSource: StockWeatherSource | null;
};

type EffectiveStockCapability = Pick<
\tStockWeatherCapability,
\t'stockWeatherAvailable' | 'weatherSource'
>;

type StockProbeDecision = EffectiveStockCapability & {
\tdefinitive: boolean;
};

type StockProbeCallResult =
\t| { source: StockWeatherSource; kind: 'success'; payload: Record<string, unknown> }
\t| { source: StockWeatherSource; kind: 'definitive-error' | 'root-absent' | 'inconclusive-error' };
"""
          text = replace_once(text, old_types, new_types, 'capability types')
          text = text.replace('STOCK_CAPABILITY_PATH', 'WEATHER_CAPABILITY_PATH')

          old_load = """\tpublic async load(): Promise<unknown> {
\t\ttry {
\t\t\treturn JSON.parse(await fs.readFile(WEATHER_CAPABILITY_PATH, 'utf8')) as unknown;
\t\t} catch (error) {
\t\t\tif ((error as NodeJS.ErrnoException).code !== 'ENOENT') {
\t\t\t\tconsole.warn('[HomeBackWeather] unable to read stock capability cache', error);
\t\t\t}
\t\t\treturn null;
\t\t}
\t}
"""
          new_load = """\tpublic async load(): Promise<unknown> {
\t\ttry {
\t\t\tawait fs.unlink(LEGACY_WEATHER_CAPABILITY_PATH);
\t\t} catch (error) {
\t\t\tif ((error as NodeJS.ErrnoException).code !== 'ENOENT') {
\t\t\t\tconsole.warn('[HomeBackWeather] unable to remove legacy capability cache', error);
\t\t\t}
\t\t}
\n\t\ttry {
\t\t\treturn JSON.parse(await fs.readFile(WEATHER_CAPABILITY_PATH, 'utf8')) as unknown;
\t\t} catch (error) {
\t\t\tif ((error as NodeJS.ErrnoException).code !== 'ENOENT') {
\t\t\t\tconsole.warn('[HomeBackWeather] unable to read stock capability cache', error);
\t\t\t}
\t\t\treturn null;
\t\t}
\t}
"""
          text = replace_once(text, old_load, new_load, 'legacy cache cleanup')

          marker = """const currentAppVersion = (): string => process.env.APP_VERSION ?? 'unknown';
const defaultCapabilityStore = (): WeatherCapabilityStore =>
\tprocess.env.APP_VERSION ? new FileWeatherCapabilityStore() : new MemoryWeatherCapabilityStore();
"""
          replacement = marker + """
const normalizedString = (value: unknown): string | null =>
\ttypeof value === 'string' && value.trim() ? value.trim() : null;

const platformIdentityFromResponse = (value: unknown): TvPlatformIdentity | null => {
\tif (!isPlainObject(value)) return null;
\tconst modelName = normalizedString(value.modelName);
\tconst firmwareVersion = normalizedString(value.firmwareVersion);
\tif (!modelName || !firmwareVersion) return null;
\treturn {
\t\tmodelName,
\t\tfirmwareVersion,
\t\tsdkVersion: normalizedString(value.sdkVersion) ?? 'unknown',
\t};
};
"""
          text = replace_once(text, marker, replacement, 'platform identity helper')

          text, count = re.subn(
              r"const validWeatherLocation = \(value: unknown\): WeatherLocation \| null => \{.*?\n\};\n\n(?=const validStockWeatherSource)",
              '', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'validWeatherLocation removal: {count}')

          new_parse = """export const parseStockWeatherCapability = (
\tvalue: unknown,
\tidentity?: TvPlatformIdentity,
): StockWeatherCapability | null => {
\tif (!isPlainObject(value)) return null;
\tif (value.schemaVersion !== STOCK_CAPABILITY_SCHEMA_VERSION) return null;
\tif (value.appVersion !== currentAppVersion()) return null;
\tconst modelName = normalizedString(value.modelName);
\tconst firmwareVersion = normalizedString(value.firmwareVersion);
\tconst sdkVersion = normalizedString(value.sdkVersion);
\tif (!modelName || !firmwareVersion || !sdkVersion) return null;
\tif (typeof value.checkedAt !== 'number' || !Number.isFinite(value.checkedAt)) return null;
\tif (typeof value.stockWeatherAvailable !== 'boolean') return null;
\tconst weatherSource = value.weatherSource === null ? null : validStockWeatherSource(value.weatherSource);
\tif (value.weatherSource !== null && !weatherSource) return null;
\tif (value.stockWeatherAvailable !== Boolean(weatherSource)) return null;
\tif (identity && (
\t\tmodelName !== identity.modelName ||
\t\tfirmwareVersion !== identity.firmwareVersion ||
\t\tsdkVersion !== identity.sdkVersion
\t)) return null;
\treturn {
\t\tschemaVersion: 2,
\t\tappVersion: value.appVersion,
\t\tmodelName,
\t\tfirmwareVersion,
\t\tsdkVersion,
\t\tcheckedAt: value.checkedAt,
\t\tstockWeatherAvailable: value.stockWeatherAvailable,
\t\tweatherSource,
\t};
};

"""
          text, count = re.subn(
              r"export const parseStockWeatherCapability = \(value: unknown\): StockWeatherCapability \| null => \{.*?\n\};\n\n(?=export const requestJson)",
              new_parse, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'capability parser replacement: {count}')

          new_class = r'''export class WeatherService {
\tprivate cache: WeatherSnapshot | null = null;
\tprivate cachedAt = 0;
\tprivate nextRetryAt = 0;
\tprivate refreshPromise: Promise<WeatherSnapshot | null> | null = null;
\tprivate capability: EffectiveStockCapability | null = null;
\tprivate capabilityPromise: Promise<EffectiveStockCapability> | null = null;

\tpublic constructor(
\t\tprivate readonly lunaCall: LunaCall,
\t\tprivate readonly jsonRequest: JsonRequest = requestJson,
\t\tprivate readonly now: () => number = Date.now,
\t\tprivate readonly capabilityStore: WeatherCapabilityStore = defaultCapabilityStore(),
\t) {}

\tpublic async initialize(): Promise<void> {
\t\tawait this.ensureStockCapability();
\t}

\tpublic current(): Promise<WeatherSnapshot | null> {
\t\tconst now = this.now();
\t\tif (this.cache && now - this.cachedAt < WEATHER_CACHE_MS) return Promise.resolve(this.cache);
\t\tif (this.refreshPromise) return this.refreshPromise;
\t\tif (now < this.nextRetryAt) return Promise.resolve(this.staleCache(now));

\t\tconst refresh = this.refreshAndCache();
\t\tthis.refreshPromise = refresh;
\t\trefresh.finally(() => {
\t\t\tif (this.refreshPromise === refresh) this.refreshPromise = null;
\t\t}).catch(() => undefined);
\t\treturn refresh;
\t}

\tprivate async refreshAndCache(): Promise<WeatherSnapshot | null> {
\t\ttry {
\t\t\tconst weather = await this.refresh();
\t\t\tif (weather) {
\t\t\t\tthis.cache = weather;
\t\t\t\tthis.cachedAt = this.now();
\t\t\t\tthis.nextRetryAt = 0;
\t\t\t\treturn weather;
\t\t\t}
\t\t} catch (error) {
\t\t\tconsole.warn('[HomeBackWeather] refresh failed', error instanceof Error ? error.message : error);
\t\t}
\t\tthis.nextRetryAt = this.now() + WEATHER_RETRY_MS;
\t\treturn this.staleCache(this.now());
\t}

\tprivate staleCache(now: number): WeatherSnapshot | null {
\t\tif (!this.cache || now - this.cachedAt > WEATHER_STALE_MS) return null;
\t\treturn { ...this.cache, stale: true };
\t}

\tprivate async refresh(): Promise<WeatherSnapshot | null> {
\t\tconst capability = await this.ensureStockCapability();
\t\tconst configuredLocationPromise = this.readCurrentWeatherLocation();
\t\tlet stockWeather: WeatherSnapshot | null = null;
\t\tlet stockPayloadLocation: WeatherLocation | null = null;

\t\tif (capability.weatherSource) {
\t\t\tconst payload = await this.readAppProperties(
\t\t\t\tcapability.weatherSource.root,
\t\t\t\tcapability.weatherSource.appId,
\t\t\t);
\t\t\tstockWeather = extractStockWeather(payload, this.now());
\t\t\tstockPayloadLocation = extractWeatherLocation(payload);
\t\t}

\t\tconst preferredLocation = await configuredLocationPromise ?? stockPayloadLocation;
\t\tif (stockWeather) {
\t\t\treturn preferredLocation?.name
\t\t\t\t? { ...stockWeather, location: preferredLocation.name }
\t\t\t\t: stockWeather;
\t\t}

\t\tconst resolvedLocation = await this.resolveWeatherLocation(preferredLocation);
\t\tif (resolvedLocation?.latitude !== undefined && resolvedLocation.longitude !== undefined) {
\t\t\treturn this.fetchOpenMeteo(resolvedLocation);
\t\t}

\t\tconst webosLocation = await this.readWebosLocation();
\t\tif (webosLocation) return this.fetchOpenMeteo(webosLocation);
\t\treturn null;
\t}

\tprivate async ensureStockCapability(): Promise<EffectiveStockCapability> {
\t\tif (this.capability) return this.capability;
\t\tif (this.capabilityPromise) return this.capabilityPromise;

\t\tthis.capabilityPromise = this.loadOrProbeStockCapability();
\t\ttry {
\t\t\tthis.capability = await this.capabilityPromise;
\t\t\treturn this.capability;
\t\t} finally {
\t\t\tthis.capabilityPromise = null;
\t\t}
\t}

\tprivate async loadOrProbeStockCapability(): Promise<EffectiveStockCapability> {
\t\tconst identity = await this.readPlatformIdentity();
\t\tif (identity) {
\t\t\ttry {
\t\t\t\tconst stored = parseStockWeatherCapability(await this.capabilityStore.load(), identity);
\t\t\t\tif (stored) {
\t\t\t\t\treturn {
\t\t\t\t\t\tstockWeatherAvailable: stored.stockWeatherAvailable,
\t\t\t\t\t\tweatherSource: stored.weatherSource,
\t\t\t\t\t};
\t\t\t\t}
\t\t\t} catch (error) {
\t\t\t\tconsole.warn('[HomeBackWeather] stock capability cache load failed', error);
\t\t\t}
\t\t}

\t\tconst decision = await this.probeStockCapability();
\t\tconst effective = {
\t\t\tstockWeatherAvailable: decision.stockWeatherAvailable,
\t\t\tweatherSource: decision.weatherSource,
\t\t};

\t\tif (!decision.definitive) {
\t\t\tconsole.warn('[HomeBackWeather] stock weather capability probe inconclusive; not cached');
\t\t\treturn effective;
\t\t}
\t\tif (!identity) {
\t\t\tconsole.warn('[HomeBackWeather] TV platform identity unavailable; stock capability not cached');
\t\t\treturn effective;
\t\t}

\t\tconst capability: StockWeatherCapability = {
\t\t\tschemaVersion: 2,
\t\t\tappVersion: currentAppVersion(),
\t\t\t...identity,
\t\t\tcheckedAt: this.now(),
\t\t\tstockWeatherAvailable: decision.stockWeatherAvailable,
\t\t\tweatherSource: decision.weatherSource,
\t\t};
\t\tawait this.persistCapability(capability);
\t\tconsole.log(
\t\t\t`[HomeBackWeather] stock weather ${capability.stockWeatherAvailable ? 'available' : 'unavailable'}; capability cached for ${capability.modelName} firmware ${capability.firmwareVersion} SDK ${capability.sdkVersion} HomeBack ${capability.appVersion}`,
\t\t);
\t\treturn effective;
\t}

\tprivate async readPlatformIdentity(): Promise<TvPlatformIdentity | null> {
\t\ttry {
\t\t\tconst response = await this.lunaCall<Record<string, unknown>>(
\t\t\t\tTV_SYSTEM_INFO_URI,
\t\t\t\t{ keys: ['modelName', 'firmwareVersion', 'sdkVersion'] },
\t\t\t\tPLATFORM_INFO_TIMEOUT_MS,
\t\t\t);
\t\t\treturn platformIdentityFromResponse(response);
\t\t} catch (error) {
\t\t\tconsole.warn('[HomeBackWeather] TV platform identity read failed', error instanceof Error ? error.message : error);
\t\t\treturn null;
\t\t}
\t}

\tprivate async probeStockCapability(): Promise<StockProbeDecision> {
\t\tconst candidates: StockWeatherSource[] = PREFERENCE_SERVICE_ROOTS.flatMap(root =>
\t\t\tSTOCK_WEATHER_APP_IDS.map(appId => ({ root, appId })),
\t\t);
\t\tconst results = await Promise.all(candidates.map(source => this.probeAppProperties(source)));

\t\tfor (const result of results) {
\t\t\tif (result.kind !== 'success') continue;
\t\t\tif (extractStockWeather(result.payload, this.now())) {
\t\t\t\treturn {
\t\t\t\t\tdefinitive: true,
\t\t\t\t\tstockWeatherAvailable: true,
\t\t\t\t\tweatherSource: result.source,
\t\t\t\t};
\t\t\t}
\t\t}

\t\tconst hasConclusiveRoot = results.some(result =>
\t\t\tresult.kind === 'success' || result.kind === 'definitive-error');
\t\tconst hasTransientFailure = results.some(result => result.kind === 'inconclusive-error');
\t\treturn {
\t\t\tdefinitive: hasConclusiveRoot && !hasTransientFailure,
\t\t\tstockWeatherAvailable: false,
\t\t\tweatherSource: null,
\t\t};
\t}

\tprivate async probeAppProperties(source: StockWeatherSource): Promise<StockProbeCallResult> {
\t\ttry {
\t\t\treturn {
\t\t\t\tsource,
\t\t\t\tkind: 'success',
\t\t\t\tpayload: await this.lunaCall<Record<string, unknown>>(
\t\t\t\t\t`${source.root}/appProperties/getAllAppPropertiesObj`,
\t\t\t\t\t{ appId: source.appId },
\t\t\t\t\tLUNA_PROBE_TIMEOUT_MS,
\t\t\t\t),
\t\t\t};
\t\t} catch (error) {
\t\t\treturn { source, kind: this.classifyProbeFailure(error) };
\t\t}
\t}

\tprivate classifyProbeFailure(error: unknown): Exclude<StockProbeCallResult['kind'], 'success'> {
\t\tconst message = error instanceof Error ? error.message : String(error);
\t\tif (/service (?:does not exist|not found)|not registered/i.test(message)) return 'root-absent';
\t\tif (/access.*denied|permission.*denied|not permitted|unknown method|method.*(?:not found|does not exist)|invalid method/i.test(message)) {
\t\t\treturn 'definitive-error';
\t\t}
\t\treturn 'inconclusive-error';
\t}

\tprivate async persistCapability(capability: StockWeatherCapability): Promise<void> {
\t\ttry {
\t\t\tawait this.capabilityStore.save(capability);
\t\t} catch (error) {
\t\t\tconsole.warn('[HomeBackWeather] unable to persist stock capability cache', error);
\t\t}
\t}

\tprivate async readCurrentWeatherLocation(): Promise<WeatherLocation | null> {
\t\tconst candidates = PREFERENCE_SERVICE_ROOTS.flatMap(root =>
\t\t\tWEATHER_LOCATION_APP_IDS.map(appId => ({ root, appId })),
\t\t);
\t\tconst directPayloads = await Promise.all(
\t\t\tcandidates.map(source => this.readLocationProperty(source.root, source.appId)),
\t\t);
\t\tfor (const payload of directPayloads) {
\t\t\tconst location = extractWeatherLocation(payload);
\t\t\tif (location) return location;
\t\t}

\t\tconst allPayloads = await Promise.all(
\t\t\tcandidates.map(source => this.readAppProperties(source.root, source.appId)),
\t\t);
\t\tfor (const payload of allPayloads) {
\t\t\tconst location = extractWeatherLocation(payload);
\t\t\tif (location) return location;
\t\t}
\t\treturn null;
\t}

\tprivate async resolveWeatherLocation(location: WeatherLocation | null): Promise<WeatherLocation | null> {
\t\tif (!location) return null;
\t\tif (location.latitude !== undefined && location.longitude !== undefined) return location;
\t\tif (!location.name) return null;
\t\tconst resolved = await this.geocode(location.name);
\t\treturn resolved ? { ...resolved, name: location.name } : null;
\t}

\tprivate async readAppProperties(root: string, appId: string): Promise<Record<string, unknown> | null> {
\t\ttry {
\t\t\treturn await this.lunaCall<Record<string, unknown>>(
\t\t\t\t`${root}/appProperties/getAllAppPropertiesObj`,
\t\t\t\t{ appId },
\t\t\t\tLUNA_PROBE_TIMEOUT_MS,
\t\t\t);
\t\t} catch {
\t\t\treturn null;
\t\t}
\t}

\tprivate async readLocationProperty(root: string, appId: string): Promise<Record<string, unknown> | null> {
\t\ttry {
\t\t\treturn await this.lunaCall<Record<string, unknown>>(
\t\t\t\t`${root}/appProperties/getAppProperty`,
\t\t\t\t{ appId, key: 'location' },
\t\t\t\tLUNA_PROBE_TIMEOUT_MS,
\t\t\t);
\t\t} catch {
\t\t\treturn null;
\t\t}
\t}

\tprivate async readWebosLocation(): Promise<WeatherLocation | null> {
\t\ttry {
\t\t\tconst response = await this.lunaCall<Record<string, unknown>>(
\t\t\t\tWEBOS_LOCATION_URI,
\t\t\t\t{ Handler: 'network', responseTimeout: 5 },
\t\t\t\tLOCATION_TIMEOUT_MS,
\t\t\t);
\t\t\treturn extractWeatherLocation(response);
\t\t} catch {
\t\t\treturn null;
\t\t}
\t}

\tprivate async geocode(name: string): Promise<WeatherLocation | null> {
\t\ttry {
\t\t\tconst url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=1&format=json`;
\t\t\tconst response = await this.jsonRequest(url, HTTP_TIMEOUT_MS);
\t\t\tif (!isPlainObject(response) || !Array.isArray(response.results)) return null;
\t\t\tconst first = response.results[0];
\t\t\tif (!isPlainObject(first)) return null;
\t\t\tconst coordinates = latitudeLongitudeFromRecord(first);
\t\t\tif (!coordinates) return null;
\t\t\treturn {
\t\t\t\t...coordinates,
\t\t\t\tname: typeof first.name === 'string' ? first.name : name,
\t\t\t};
\t\t} catch (error) {
\t\t\tconsole.warn('[HomeBackWeather] geocoding failed', error instanceof Error ? error.message : error);
\t\t\treturn null;
\t\t}
\t}

\tprivate async fetchOpenMeteo(location: WeatherLocation): Promise<WeatherSnapshot | null> {
\t\tif (location.latitude === undefined || location.longitude === undefined) return null;
\t\ttry {
\t\t\tconst url = 'https://api.open-meteo.com/v1/forecast' +
\t\t\t\t`?latitude=${encodeURIComponent(String(location.latitude))}` +
\t\t\t\t`&longitude=${encodeURIComponent(String(location.longitude))}` +
\t\t\t\t'&current=temperature_2m,weather_code&temperature_unit=celsius&timezone=auto';
\t\t\tconst response = await this.jsonRequest(url, HTTP_TIMEOUT_MS);
\t\t\tif (!isPlainObject(response) || !isPlainObject(response.current)) return null;
\t\t\tconst temperatureC = finiteNumber(response.current.temperature_2m);
\t\t\tconst weatherCode = finiteNumber(response.current.weather_code);
\t\t\tif (temperatureC === null) return null;
\t\t\treturn {
\t\t\t\ttemperatureC,
\t\t\t\tcondition: weatherCode === null ? 'unknown' : conditionFromWmoCode(weatherCode),
\t\t\t\tobservedAt: this.now(),
\t\t\t\t...(location.name ? { location: location.name } : {}),
\t\t\t\tsource: 'webos-location-openmeteo',
\t\t\t};
\t\t} catch (error) {
\t\t\tconsole.warn('[HomeBackWeather] weather fetch failed', error instanceof Error ? error.message : error);
\t\t\treturn null;
\t\t}
\t}
}
'''
          text, count = re.subn(r'export class WeatherService \{.*\Z', new_class, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'WeatherService replacement: {count}')
          weather_path.write_text(text)

          tests_path = Path('tests/weather-capability-v2.test.ts')
          tests = tests_path.read_text()
          tests = tests.replace("\t\tschemaVersion: 1,", "\t\tschemaVersion: 2,", 1)
          tests = tests.replace("\t\tweatherLocation: null,\n", "", 1)
          tests_path.write_text(tests)

          old_weather_tests = Path('tests/weather.test.ts')
          wt = old_weather_tests.read_text()
          replacement_test = r'''test('stock weather availability is probed once and reused across service restarts', async () => {
\tconst store = new MemoryCapabilityStore();
\tconst platform = {
\t\treturnValue: true,
\t\tmodelName: 'OLED55C5PSA',
\t\tfirmwareVersion: '33.20.10',
\t\tsdkVersion: '25.0.0',
\t};
\tlet firstStockProbeCalls = 0;
\tconst firstLunaCall = async <T extends Record<string, any>>(
\t\turi: string,
\t\tparams: Record<string, any> = {},
\t): Promise<T> => {
\t\tif (uri.endsWith('/getSystemInfo')) return platform as T;
\t\tif (uri.includes('getAllAppPropertiesObj')) {
\t\t\tfirstStockProbeCalls++;
\t\t\tif (params.appId === 'com.webos.app.home') {
\t\t\t\treturn {
\t\t\t\t\treturnValue: true,
\t\t\t\t\tvalues: [{
\t\t\t\t\t\tTemperature: { Metric: { Value: 22.1 } },
\t\t\t\t\t\tWeatherText: 'Clear',
\t\t\t\t\t}],
\t\t\t\t} as T;
\t\t\t}
\t\t\treturn { returnValue: true, values: [] } as T;
\t\t}
\t\tthrow new Error('unavailable');
\t};
\tconst first = new WeatherService(firstLunaCall, async () => null, () => NOW, store);

\tawait first.initialize();
\tassert.ok(firstStockProbeCalls > 1);
\tassert.equal(store.saves, 1);
\tassert.equal(store.value?.stockWeatherAvailable, true);
\tassert.equal(store.value?.weatherSource?.appId, 'com.webos.app.home');

\tlet secondStockSourceCalls = 0;
\tlet locationReads = 0;
\tconst secondLunaCall = async <T extends Record<string, any>>(
\t\turi: string,
\t\tparams: Record<string, any> = {},
\t): Promise<T> => {
\t\tif (uri.endsWith('/getSystemInfo')) return platform as T;
\t\tif (uri.includes('getAppProperty')) {
\t\t\tlocationReads++;
\t\t\treturn {
\t\t\t\treturnValue: true,
\t\t\t\tlocation: { locationKey: '24741', localizedName: 'Brisbane' },
\t\t\t} as T;
\t\t}
\t\tif (uri.includes('getAllAppPropertiesObj') && params.appId === 'com.webos.app.home') {
\t\t\tsecondStockSourceCalls++;
\t\t\treturn {
\t\t\t\treturnValue: true,
\t\t\t\tvalues: [{
\t\t\t\t\tTemperature: { Metric: { Value: 22.8 } },
\t\t\t\t\tWeatherText: 'Partly cloudy',
\t\t\t\t}],
\t\t\t} as T;
\t\t}
\t\tthrow new Error(`unexpected Luna call: ${uri}`);
\t};
\tconst second = new WeatherService(secondLunaCall, async () => null, () => NOW, store);

\tawait second.initialize();
\tassert.equal(secondStockSourceCalls, 0, 'startup should validate identity but not rescan stock candidates');
\tconst weather = await second.current();
\tassert.equal(secondStockSourceCalls, 1, 'refresh should query only the stored stock weather source');
\tassert.ok(locationReads > 0, 'weather location remains dynamic even when stock weather capability is cached');
\tassert.equal(weather?.temperatureC, 22.8);
\tassert.equal(weather?.condition, 'partly-cloudy');
\tassert.equal(store.saves, 1, 'loading a matching capability must not rewrite it');
});
'''
          wt, count = re.subn(
              r"test\('stock weather availability is probed once and reused across service restarts'.*\Z",
              replacement_test, wt, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'legacy weather lifecycle tests replacement: {count}')
          old_weather_tests.write_text(wt)

          docs = Path('docs/WEATHER-STATUS-TILE.md')
          docs.write_text('''# Status weather tile\n\nHomeBack renders a passive status tile at the fixed right edge of the ribbon. The tile is outside launcher-card navigation, ordering, editing and focus state.\n\n## Weather data flow\n\nThe helper caches a successful weather snapshot for 20 minutes and may use the last snapshot for up to two hours when a refresh fails. Stock-weather capability discovery is separate from the user's Weather Location setting.\n\nAfter HomeBack bootstrap, the helper reads `modelName`, `firmwareVersion` and `sdkVersion` from `com.webos.service.tv.systemproperty/getSystemInfo`. A persisted stock-weather verdict is reusable only when those three values **and** the HomeBack version match. A TV firmware/webOS upgrade therefore invalidates the old verdict even if HomeBack itself was not upgraded.\n\nIf no matching record exists, HomeBack probes the known local LG preference sources for stock weather. A positive result is persisted. A negative result is persisted only when the probe is definitive: calls returned successfully without weather, or the method is definitively absent/denied. Timeouts, startup races, missing/unready services and other inconclusive failures are not written to disk, so the next launch probes again.\n\nThe machine-written capability record is stored at `/var/lib/homeback/weather-capability.json`. The old `/home/root/.config/homeback/weather-capability.json` location is removed when the new store is first read.\n\nLG's Weather Location Setting is **not** part of capability state. HomeBack reads it again on every actual weather refresh. If stock weather is unavailable, HomeBack uses the fresh LG weather location when available; otherwise it asks `com.webos.service.location` for coordinates and then requests current conditions from Open-Meteo. This is the fallback path for older TVs that expose no stock weather values.\n\n## Reset capability discovery\n\nTo force stock-weather capability discovery again without changing firmware or HomeBack version, remove the machine-state file and restart the helper service:\n\n```sh\nrm -f /var/lib/homeback/weather-capability.json\nluna-send -n 1 -f luna://com.homebrew.homeback.service/restartService '{}'\n```\n\nThe next HomeBack launch/weather request performs a fresh probe. Do not edit this file as user configuration.\n\n## Conditions and failure behavior\n\nWeather responses normalize to clear, partly cloudy, cloudy, rain, heavy rain, storm, snow, fog and unknown. Missing LG weather services, denied location access, failed geocoding or network failure do not affect launcher navigation; the tile continues to show the clock and displays `--°` until a weather snapshot is available.\n''')

          readme = Path('README.md')
          r = readme.read_text()
          marker = '## Weather capability reset'
          if marker not in r:
              r += '''\n\n## Weather capability reset\n\nStock-weather capability is machine state, not user configuration. HomeBack stores it at `/var/lib/homeback/weather-capability.json`, keyed by TV model, firmware version, webOS SDK version and HomeBack version. LG Weather Location is read dynamically and is not stored in that record.\n\nIf weather capability discovery ever needs to be forced again, delete the state file and restart the helper:\n\n```sh\nrm -f /var/lib/homeback/weather-capability.json\nluna-send -n 1 -f luna://com.homebrew.homeback.service/restartService '{}'\n```\n\nSee [`docs/WEATHER-STATUS-TILE.md`](./docs/WEATHER-STATUS-TILE.md) for the probe/fallback behavior.\n'''
          readme.write_text(r)
          PY
      - name: Commit implementation and remove helper workflow
        shell: bash
        run: |
          git rm .github/workflows/apply-weather-capability-v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/service/src/weather.ts tests/weather.test.ts tests/weather-capability-v2.test.ts docs/WEATHER-STATUS-TILE.md README.md
          git commit -m "Fix weather capability lifecycle"
          git push origin HEAD:fix/weather-capability-v2
