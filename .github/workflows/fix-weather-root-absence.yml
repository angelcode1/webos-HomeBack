name: Apply weather root-absence fix

on:
  push:
    branches:
      - fix/weather-capability-v2

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/weather-capability-v2
      - name: Make missing service roots transient
        shell: python
        run: |
          from pathlib import Path
          path = Path('packages/service/src/weather.ts')
          text = path.read_text()
          old = "\t\tconst hasTransientFailure = results.some(result => result.kind === 'inconclusive-error');"
          new = "\t\tconst hasTransientFailure = results.some(result =>\n\t\t\tresult.kind === 'inconclusive-error' || result.kind === 'root-absent');"
          if text.count(old) != 1:
              raise SystemExit(f'expected one probe-classification line, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
      - name: Commit source and remove helper workflow
        shell: bash
        run: |
          git rm .github/workflows/fix-weather-root-absence.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/service/src/weather.ts
          git commit -m "Treat missing weather service roots as transient"
          git push origin HEAD:fix/weather-capability-v2
