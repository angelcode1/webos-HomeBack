name: Publish HomeBack 0.4.17 release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Publish tagged 0.4.17 release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          ref: v0.4.17
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate
          yarn --version
      - name: Validate tagged version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          APP_ID="$(node -p "require('./package.json').id")"
          test "$VERSION" = "0.4.17"
          test "$APP_ID" = "com.homebrew.homeback"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 v0.4.17)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APP_ID=$APP_ID" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: yarn install --immutable
      - name: Verify source
        run: yarn check:full
      - name: Verify publication
        env:
          HOMEBACK_NATIVE_REDISTRIBUTION_CONFIRMED: ${{ vars.HOMEBACK_NATIVE_REDISTRIBUTION_CONFIRMED }}
        run: yarn verify:publication
      - name: Build production IPK
        run: |
          rm -rf dist
          yarn build
      - name: Validate IPK exists
        run: |
          IPK="dist/${APP_ID}_${VERSION}_all.ipk"
          echo "Expected IPK: $IPK"
          test -f "$IPK"
          echo "IPK_PATH=$IPK" >> "$GITHUB_ENV"
      - name: Fix IPK Installed-Size
        run: bash scripts/fix-ipk-installed-size.sh "$IPK_PATH"
      - name: Generate SHA256 checksum
        run: |
          sha256sum "$IPK_PATH" > "${IPK_PATH}.sha256"
          cat "${IPK_PATH}.sha256"
      - name: Generate Homebrew manifest
        run: |
          IPK_HASH="$(cut -d' ' -f1 "${IPK_PATH}.sha256")"
          IPK_NAME="$(basename "$IPK_PATH")"
          MANIFEST_PATH="com.homebrew.homeback.manifest.json"
          IPK_HASH="$IPK_HASH" IPK_NAME="$IPK_NAME" MANIFEST_PATH="$MANIFEST_PATH" node scripts/generate-manifest.cjs
          cat "$MANIFEST_PATH"
          echo "MANIFEST_PATH=$MANIFEST_PATH" >> "$GITHUB_ENV"
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.4.17 >/dev/null 2>&1; then
            gh release upload v0.4.17 "$IPK_PATH" "${IPK_PATH}.sha256" "$MANIFEST_PATH" --clobber
          else
            gh release create v0.4.17 "$IPK_PATH" "${IPK_PATH}.sha256" "$MANIFEST_PATH" --target v0.4.17 --title "HomeBack ${VERSION}" --generate-notes
          fi
